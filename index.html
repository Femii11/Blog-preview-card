<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="font" href="https://fonts.google.com/specimen/Figtree?query=figtree">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: hsl(47, 88%, 63%);
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      margin-top: 50px;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    div {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: hsl(210, 46%, 95%);
      max-width: 350px;
      height: 100%;
      width: 90%;
      margin: 0 auto;
      margin-top: 5%;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid hsl(0, 0%, 7%);
      box-shadow: 11px 11px 5px 2px hsl(0, 0%, 7%);
      font-family: 'Figtree', sans-serif;
    }

    .learning {
      background-color: hsl(47, 88%, 63%);
      padding: 5px 10px;
      border-radius: 5px;
      float: left;
      margin: 10px 0;
      align-self: flex-start;
      font-weight: bold;
      font-family: 'Figtree', sans-serif;
    }

    .blog-image {
      width: 100%;
      height: 100%;
      border-radius: 15px;
    }

    .blog-content {
      margin: 0 0;
      line-height: 1.2;
    }

    .blog-content>:last-child {
      color: hsl(0, 0%, 42%);
    }

    .blog-content>:first-child {
      color: hsl(0, 0%, 7%);
    }

    h1 {
      font-size: 1.5rem;
      margin: 10px 0;
    }

    p {
      font-size: 14px;
      margin: 5px 0;
    }

    .blog {
      display: flex;
      align-items: center;
      margin: 10px 0;
      align-self: flex-start;
    }

    .blog>img {
      width: 20%;
      height: auto;
      border-radius: 50%;
      margin-right: 10px;
    }

    .blog>p {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main>
    <div>
      <span>
        <img src="./assets/images/illustration-article.svg" alt="illustration article" class="blog-image">
      </span>
      <span class="learning">
        Learning
      </span>
      <span class="blog-content">
        <p>Published 21 Dec 2023</p>
        <h1>HTML & CSS foundations</h1>
        <p>The langauge are the backbone of every website, defining stucture, content and presentation.</p>
      </span>
      <span class="blog">
        <img src="./assets/images/image-avatar.webp" alt="image avatar" class="blo-image">
        <p>Greg Hooper</p>
      </span>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://x.com/femii_dev">FEMII_DEV</a>.
  </footer>
</body>

</html>
